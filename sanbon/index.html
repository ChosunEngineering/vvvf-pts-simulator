 {p:[['발차',-7],['2경계',-18],['장내경계~',2]],n:'제동 주의역'},
 {p:[['~4경계',2],['',3],['',7],['3경계·절연',-30],['1경계~정지',-8]],n:'교-직 절연구간 무동력 · 제동 주의역(정지위치 일치)'}
];
const WHO={act:['동작','var(--act)'],me:['나','var(--me)'],cdr:['차장','var(--cdr)'],ctl:['관제','var(--ctl)']};
const $=s=>document.querySelector(s);const NARROW=()=>innerWidth<600;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let opt=Object.assign({hl:true,th:'dark'},ls.get('sbu5.opt',{}));
document.documentElement.dataset.theme=opt.th;
let st=0,F=[],p=0;
function build(s){return SC[s].items.filter(x=>opt.hl||!x.hl)}
function scrOf(it){return (SCR[st]||{})[SC[st].items.indexOf(it)]}
function routeHTML(si){const fs=new Set(F.filter(x=>!x.end).map(x=>x.s));let h='';
 STN.forEach((n,i)=>{h+='<div class="st'+(i===si||i===si+1?' on':'')+'">'+(i<10?'<span class="seg'+(i===si?' on':'')+(fs.has(i)?' f':'')+'"></span>':'')+esc(NARROW()?['산본','금정','범계','평촌','인덕','정부','과천','대공','경마','선바','남태'][i]:n.replace('정부과천','정부'))+'</div>'});return h}
function gradHTML(si){const g=GRAD[si];if(!g)return'';return g.p.map(([l,v])=>'<div class="gb '+(v>0?'u':v<0?'d':'z')+'" style="flex:'+(1+Math.abs(v)/20)+'"><div class="v">'+(v>0?'▲':v<0?'▼':'')+Math.abs(v)+'</div><div class="l">'+esc(l||' ')+'</div></div>').join('')}
// 운전 요령 흐름 (상선 요령표 → 그림) a: pow 역행 / off 동력OFF / brk 제동 / rel 완해 / nt 메모
const FLOW=[
 [['발차','pow'],['45','off','OFF'],['2→4단','brk','감도시험'],['35','rel','완해'],['55','off','OFF'],['67','brk','제동 2단'],['제1장내','brk','4단'],['30','rel','완해'],['40','brk','제동·완해 반복'],['금정 정차','nt']],
 [['40','off','OFF'],['67','brk','제동 2단'],['60','rel','완해']],
 [['65','off','OFF']],
 [['65','off','OFF']],
 [['75','off','OFF'],['65','brk','제동 2단'],['50','rel','완해']],
 [['60','off','OFF']],
 [['60','off','OFF'],['50','pow','재역행'],['58','off','OFF']],
 [['60','off','OFF']],
 [['60','off','OFF']],
 [['60','off','OFF'],['절연','nt','타행·MCB']]
];
const BLK=[0,8,3,5,10,3,3,4,3,6]; // 역간 폐색 수 (도면 원번호 최대)
const CN='①②③④⑤⑥⑦⑧⑨⑩';
function posOf(it){const a=it.at;if(it.end)return 1;
 const ns=[...a].map(c=>CN.indexOf(c)+1).filter(n=>n>0),B=BLK[it.s]||0;
 if(ns.length&&B){const m=ns.reduce((x,y)=>x+y,0)/ns.length;return Math.min(.9,Math.max(.17,1-m/(B+1)))}
 if(/장내/.test(a))return .93;if(/접근/.test(a))return .88;if(/출발 전/.test(a))return .17;if(/발차 직후|출발/.test(a))return .12;
 if(/절연/.test(a))return .45;if(/역/.test(a))return .17;return .5}
function trackSVG(si,list,cur){const VW=NARROW()?520:1000;$('#svTrack').setAttribute('viewBox','0 0 '+VW+' 112');const x0=46,x1=VW-46,W=x1-x0,B=BLK[si];let s='';
 s+='<line x1="'+x0+'" y1="80" x2="'+x1+'" y2="80" stroke="var(--sub)" stroke-width="5"/>';
 for(let n=1;n<=B;n++){const x=x0+W*(1-n/(B+1));s+='<line x1="'+x+'" y1="72" x2="'+x+'" y2="88" stroke="var(--sub)" stroke-width="3"/><text x="'+x+'" y="106" text-anchor="middle" font-size="20" fill="var(--sub)">'+CN[n-1]+'</text>'}
 [[x0,STN[si]],[x1,STN[si+1]]].forEach(([x,n])=>{s+='<rect x="'+(x-46)+'" y="66" width="92" height="28" rx="6" fill="var(--card)" stroke="var(--ok)" stroke-width="3"/><text x="'+x+'" y="87" text-anchor="middle" font-size="20" font-weight="800" fill="var(--tx)">'+esc(n.replace('정부과천','정부'))+'</text>'});
 const used=[];list.forEach((it,k)=>{let x=x0+W*posOf(it);while(used.some(u=>Math.abs(u-x)<48))x+=48;used.push(x);const on=it===cur,col=it.hl?'var(--hl)':'var(--bad)';
  s+='<line x1="'+x+'" y1="'+(on?50:44)+'" x2="'+x+'" y2="72" stroke="'+col+'" stroke-width="3"/>';
  s+='<circle cx="'+x+'" cy="'+(on?30:28)+'" r="'+(on?24:18)+'" fill="'+(on?col:'var(--card)')+'" stroke="'+col+'" stroke-width="4"/><text x="'+x+'" y="'+(on?39:35)+'" text-anchor="middle" font-size="'+(on?26:20)+'" font-weight="900" fill="'+(on?'#111':col)+'">'+(k+1)+'</text>'});
 return s}
function gradSVG(si){const g=GRAD[si];if(!g)return'';const VW=NARROW()?520:1000;$('#svGrad').setAttribute('viewBox','0 0 '+VW+' 100');const x0=14,x1=VW-14,n=g.p.length,w=(x1-x0)/n;let y=0,pts=[[x0,0]];g.p.forEach(([l,v],i)=>{y+=v;pts.push([x0+w*(i+1),y])});
 const ys=pts.map(p=>p[1]),mn=Math.min(...ys),mx=Math.max(...ys),sc=(mx-mn)||1,Y=v=>78-(v-mn)/sc*38;let s='<text x="'+x1+'" y="14" text-anchor="end" font-size="15" font-weight="700" fill="var(--sub)">구배 ‰ · 길이 개략</text>';
 s+='<polygon points="'+x0+',82 '+pts.map(p=>p[0]+','+Y(p[1])).join(' ')+' '+x1+',82" fill="color-mix(in srgb,var(--sub) 18%,transparent)"/>';
 g.p.forEach(([l,v],i)=>{const a=pts[i],b=pts[i+1],col=v>0?'var(--up)':v<0?'var(--dn)':'var(--sub)',cx=(a[0]+b[0])/2;
  s+='<line x1="'+a[0]+'" y1="'+Y(a[1])+'" x2="'+b[0]+'" y2="'+Y(b[1])+'" stroke="'+col+'" stroke-width="7" stroke-linecap="round"/>';
  s+='<text x="'+cx+'" y="'+Math.min(Y(a[1]),Y(b[1])-0)+'" dy="-8" text-anchor="middle" font-size="26" font-weight="900" fill="'+col+'">'+(v>0?'▲':v<0?'▼':'')+Math.abs(v)+'</text>';
  if(l)s+='<text x="'+cx+'" y="97" text-anchor="middle" font-size="17" fill="var(--sub)">'+esc(l)+'</text>'});
 return s}
function gradHTML(si){const g=GRAD[si];return g?g.p.map(([l,v])=>'<span style="color:'+(v>0?'var(--up)':'var(--dn)')+';font-weight:800;margin-right:6px">'+(v>0?'▲':'▼')+Math.abs(v)+'</span>').join(''):''}
function flowHTML(si){return (FLOW[si]||[]).map(([v,a,x])=>'<div class="fs '+a+'"><span class="v">'+esc(v)+'</span>'+(x?'<span class="a">'+esc(x)+'</span>':'')+'</div>').join('<span class="ar">›</span>')}
function render(){
  const it=F[p],si=Math.min(it.s,9),sec=SEC[si];
  const list=F.filter(x=>!x.end&&x.s===si),k=list.indexOf(it),secs=[...new Set(F.filter(x=>!x.end).map(x=>x.s))];
  $('#tName').textContent=SC[st].name;$('#tProg').textContent=(p+1)+'/'+F.length;
  $('#route').innerHTML=routeHTML(it.end?9:si);
  $('#at').textContent=it.end?'남태령 도착':(k>=0?'고장 '+(k+1)+'/'+list.length+' · ':'')+it.at;
  $('#ttl').textContent=it.t;$('#ttl').className=it.hl?'hl':'';
  let tg='';if(it.m)tg+='<span class="tag man">수동조작</span>';if(it.hl)tg+='<span class="tag hl">형광 · 후반 적용</span>';
  (it.c||[]).forEach(c=>tg+='<span class="tag">'+esc(c)+'</span>');if(it.q)tg+='<span class="tag q">⚠ '+esc(it.q)+'</span>';
  if(it.end)tg+='<span class="tag">'+esc(SC[st].legend)+'</span>';
  $('#tags').innerHTML=tg;
  const sc=scrOf(it);let lh='';
  if(sc){if(sc.tip)lh+='<div class="tipline">💡 '+esc(sc.tip)+'</div>';
    sc.lines.forEach(l=>{const w=WHO[l.who]||WHO.act;lh+='<div class="ln '+esc(l.who)+'"><span class="w" style="background:'+w[1]+'">'+w[0]+'</span><span class="t">'+esc(l.t)+(l.ex?'<span class="ex">예시</span>':'')+'</span></div>'})}
  $('#lines').innerHTML=lh;
  let lk='';if(sc&&sc.src&&sc.src.length)lk+='<span class="tag lnk" data-raw="'+sc.src.join(',')+'">📄 5장 '+sc.src.join('·')+' 원문</span>';
  if(it.k6)lk+='<span class="tag lnk" data-oral="'+it.k6.join(',')+'">📖 구술 '+it.k6.join('·')+'</span>';
  $('#links').innerHTML=lk;$('#card').scrollTop=0;
  $('#gSec').textContent=sec.n;$('#gWarn').textContent=/제동 주의/.test(sec.g||'')?'제동 주의':'';$('#gWarn').style.display=$('#gWarn').textContent?'':'none';
  $('#gIdx').textContent='역간 '+(secs.indexOf(si)+1)+'/'+secs.length;
  $('#svTrack').innerHTML=trackSVG(si,list,it);$('#svGrad').innerHTML=gradSVG(si);$('#flow').innerHTML=flowHTML(si);
  $('#legend').innerHTML=list.map((x,j)=>'<span data-j="'+F.indexOf(x)+'" class="'+(x===it?'cur':'')+'" style="'+(x.hl&&x!==it?'color:var(--hl)':'')+'">'+(j+1)+'. '+esc(x.t)+'</span>').join('');
  $('#gNote').textContent=(GRAD[si]&&GRAD[si].n||'')+(sec.q?' · ⚠ '+sec.q:'');
  const nx=F[p+1];$('#nextUp').innerHTML=nx?'터치 ▸ 다음: <b>'+esc(nx.t)+'</b>'+(nx.s!==it.s&&!nx.end?' <span style="color:var(--ok)">('+esc(SEC[nx.s].n)+')</span>':''):'마지막입니다';
  const c=$('#card');c.style.animation='none';void c.offsetWidth;c.style.animation='';fade();
  ls.set('sbu5.pos',{st,p,hl:opt.hl});
}
function go(d){const np=Math.max(0,Math.min(F.length-1,p+d));if(np===p)return;p=np;render();try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
$('#card').addEventListener('click',e=>{const r=e.target.closest('[data-raw]');if(r){openRaw(r.dataset.raw.split(','));return}const t=e.target.closest('[data-oral]');if(t){openOral(t.dataset.oral.split(','));return}go(1)});
$('#guide').onclick=e=>{if(e.target.closest('#gTog')){opt.min=!opt.min;ls.set('sbu5.opt',opt);applyMin();return}const j=e.target.closest('[data-j]');if(j){p=+j.dataset.j;render();return}if(e.target.closest('#flow,#legend'))return;go(1)};
function applyMin(){$('#guide').classList.toggle('min',!!opt.min);$('#gTog').textContent=opt.min?'▴':'▾';fade()}
function fade(){const c=$('#card');$('#cardWrap').style.setProperty('--fade',c.scrollHeight-c.scrollTop-c.clientHeight>8?1:0)}
$('#card').addEventListener('scroll',fade,{passive:true});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if($('#run').classList.contains('show'))render()},150)});
$('#bPrev').onclick=()=>go(-1);
let tx=null,ty=null;$('#card').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('#card').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.5){e.preventDefault();go(dx>0?-1:1)}},{passive:false});
document.addEventListener('keydown',e=>{if(!$('#run').classList.contains('show')||document.querySelector('.ov.show'))return;if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}});
function start(s,pos){applyMin();st=s;F=build(s);p=Math.max(0,Math.min(pos||0,F.length-1));$('#home').classList.remove('show');$('#run').classList.add('show');wake();render()}
document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(+b.dataset.start,0));
$('#bResume').onclick=()=>{const r=ls.get('sbu5.pos',null);if(r){opt.hl=r.hl;start(r.st,r.p)}};
$('#bHome').onclick=()=>{$('#run').classList.remove('show');$('#home').classList.add('show');homeUI()};
function homeUI(){
  $('#oHl').textContent='형광 고장: '+(opt.hl?'포함':'제외(초반 회차)');$('#oHl').classList.toggle('on',opt.hl);
  $('#oTh').textContent='화면: '+(opt.th==='dark'?'어둡게':'밝게');
  [0,1].forEach(s=>{const n=SC[s].items.filter(x=>!x.end&&(opt.hl||!x.hl)).length;$('#h'+s).textContent='고장 '+n+'개 · '+SC[s].legend});
  const r=ls.get('sbu5.pos',null);$('#bResume').style.display=r?'':'none';if(r)$('#hR').textContent=SC[r.st].name+' · '+(r.p+1)+'번째 고장부터';
  ls.set('sbu5.opt',opt)}
$('#oHl').onclick=()=>{opt.hl=!opt.hl;homeUI()};
$('#oTh').onclick=()=>{opt.th=opt.th==='dark'?'light':'dark';document.documentElement.dataset.theme=opt.th;homeUI()};
function show(id){document.getElementById(id).classList.add('show')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.ov').classList.remove('show'));
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{if(b.dataset.open==='tip'){tipTable('up');show('ovTip')}else{only=null;dicHTML('');show('ovDic')}});
$('#bList').onclick=()=>{let h='',ls_=-1;F.forEach((x,i)=>{if(x.s!==ls_&&!x.end){h+='<div class="li sh">'+esc(SEC[x.s].n)+'</div>';ls_=x.s}h+='<div class="li'+(x.hl?' hl':'')+(i===p?' cur':'')+'" data-i="'+i+'"><div class="s">'+(i+1)+'. '+esc(x.at)+'</div><div class="t">'+esc(x.t)+'</div></div>'});
 $('#listB').innerHTML=h;show('ovList');const c=$('#listB .cur');if(c)c.scrollIntoView({block:'center'})};
$('#listB').onclick=e=>{const t=e.target.closest('[data-i]');if(!t)return;p=+t.dataset.i;render();$('#ovList').classList.remove('show')};
function tipTable(d){let h='<table>';if(d==='up')SEC.forEach((s,i)=>h+='<tr><td>'+esc(s.n)+'</td><td>'+s.tip+(s.g?' <span style="color:var(--warn)">('+esc(s.g)+')</span>':'')+'<div style="margin-top:6px">'+gradHTML(i)+'</div></td></tr>');else DN.forEach(r=>h+='<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>');$('#tipB').innerHTML=h+'</table>';document.querySelectorAll('#tipSeg button').forEach(b=>b.classList.toggle('on',b.dataset.d===d))}
document.querySelectorAll('#tipSeg button').forEach(b=>b.onclick=()=>tipTable(b.dataset.d));
let quiz=false,only=null;
function dicHTML(f){f=(f||'').toLowerCase();let h='';
 if(only)h+='<p class="note">이 고장 관련 구술 '+only.length+'개 · <a href="#" id="allOral" style="color:var(--acc)">6장 전체 보기</a></p>';
 C6.forEach((d,i)=>{if(only&&!only.includes(d.no))return;if(f&&!(d.no+' '+d.title+' '+d.body).toLowerCase().includes(f))return;
 h+='<div class="de'+(quiz?'':' open')+'"><h3>'+esc(d.no)+' '+esc(d.title)+'</h3>'+(quiz?'<button class="rvb" data-rv>답 보기</button>':'')+'<div class="rv"><div class="o">'+esc(d.body)+'</div></div></div>'});
 $('#dicB').innerHTML=h||'<p class="note">검색 결과 없음</p>';const a=$('#allOral');if(a)a.onclick=ev=>{ev.preventDefault();only=null;dicHTML($('#q').value)}}
function openOral(list){only=list;$('#q').value='';dicHTML('');show('ovDic');$('#ovDic .ovb').scrollTop=0}
function openRaw(list){$('#rawT').textContent='교재 5장 '+list.join('·')+' 원문';$('#rawB').textContent=list.map(n=>C5[n]?n+' '+C5[n].title+'\n'+C5[n].body:n).join('\n\n');show('ovRaw')}
$('#q').oninput=e=>dicHTML(e.target.value);
$('#bQuiz').onclick=()=>{quiz=!quiz;$('#bQuiz').classList.toggle('on',quiz);dicHTML($('#q').value)};
$('#dicB').onclick=e=>{const b=e.target.closest('[data-rv]');if(b)b.closest('.de').classList.toggle('open')};
async function wake(){try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&$('#run').classList.contains('show'))wake()});
homeUI();
</script>
